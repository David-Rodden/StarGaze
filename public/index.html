<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarGaze | Find Darker Skies</title>
    <link rel="shortcut icon" type="image/x-icon" href="../images/crescent.ico"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <link rel="stylesheet" type="text/css" href="stylesheet.css">
    <script src="geolocate.js" defer></script>
</head>
<body>
<main class="app-shell">
    <section class="app-panel">
        <p class="eyebrow">StarGaze</p>
        <h1>Find clearer night skies near you.</h1>
        <p class="subtitle">A streamlined dark-sky explorer with live geolocation and local light-pollution density data.</p>
        <div class="panel-actions">
            <button id="locate-btn" type="button">Use my location</button>
            <p id="status" aria-live="polite">Initializing map...</p>
        </div>
    </section>
    <section class="map-wrap">
        <div id="map" role="application" aria-label="StarGaze map"></div>
        <div class="legend" aria-hidden="true">
            <span><i class="dot low"></i> Lower light pollution</span>
            <span><i class="dot high"></i> Higher light pollution</span>
        </div>
    </section>
</main>
</body>
</html>
